services:
  tp-rl-2rm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tp-rl-2rm:latest
    container_name: tp-rl-2rm
    working_dir: /workspace/SUMMER-SCHOOL-RL
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ..:/workspace/SUMMER-SCHOOL-RL
      - ../1.Training/src/unitree_go2_velocity:/opt/mjlab/src/mjlab/tasks/velocity/config/go2
      - ../logs:/opt/mjlab/logs
      - ../wandb:/opt/mjlab/wandb
      - /tmp/.X11-unix:/tmp/.X11-unix
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    command: bash
